<!DOCTYPE html>
<!-- security-reviewed: the mini-app sandbox (D-019, D-132). It is loaded only in
     <iframe sandbox="allow-scripts"> - never allow-same-origin - so it has an opaque origin and
     cannot reach Family Hub's storage, the Drive folder or the page around it. A mini-app's code
     is inline by nature, so this page's own policy allows inline scripts, and blocks every
     request (connect-src 'none', default-src 'none'). The code, the bridge and the theme arrive
     by postMessage from the parent, after the SHA-256 fingerprint check in js/ui/packages.js. -->
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-app</title>
</head>
<body><div id="app"></div>
<script>
  // Take the code from the page that holds this frame, once; then say ready.
  (function () {
    var booted = false;
    addEventListener('message', function (e) {
      var m = e.data;
      if (booted || e.source !== parent || !m || m.fh !== 1 || m.type !== 'boot') return;
      booted = true;
      var style = document.createElement('style');
      style.textContent = String(m.css || '');
      document.head.appendChild(style);
      [m.bridge, m.code].forEach(function (code) {
        var s = document.createElement('script');
        s.textContent = String(code || '');
        document.body.appendChild(s);
      });
    });
    parent.postMessage({ fh: 1, type: 'ready' }, '*');
  }());
</script>
</body>
</html>
